name: Narrateify
options:
  bundleIdPrefix: com.narrateify
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions:
    - en
    - tr
    - Base

packages:
  OnnxRuntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager.git
    exactVersion: 1.24.2
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: 9.29.2
  # Qwen3-TTS (MLX) and Kokoro's phonemizer, for the narrateify-models helper only. No
  # tagged releases upstream, so pinned to a reviewed commit.
  speech-swift:
    url: https://github.com/soniqo/speech-swift
    revision: 3f58a58a8f867a4c87b97dbf4d6050d6a88ef665
  # Already a speech-swift dependency; listed so the helper can cap MLX's cache.
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.30.0

targets:
  Narrateify:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
        excludes:
          - Vendor/Sonic/README.md
          - Vendor/Sonic/LICENSE
    dependencies:
      - package: OnnxRuntime
        product: onnxruntime
      - package: Sentry
        product: Sentry
      # The `narrateify` CLI/MCP binary ships inside the app:
      # Narrateify.app/Contents/SharedSupport/narrateify
      - target: NarrateifyCLI
        embed: true
        codeSign: true
        copy:
          destination: sharedSupport
      # On-demand models helper (Qwen3 on MLX, Kokoro on ONNX Runtime;
      # macOS 15+, Apple silicon), started per model when a call asks for it.
      - target: NarrateifyModels
        embed: true
        codeSign: true
        copy:
          destination: sharedSupport
    postBuildScripts:
      # SwiftPM resource bundles the helper loads from its own directory
      # (MLX's Metal kernels, Hub's configs, Kokoro's fr/pt/hi dictionaries).
      - name: Copy model helper resources
        basedOnDependencyAnalysis: false
        script: |
          dest="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/SharedSupport"
          for b in mlx-swift_Cmlx swift-transformers_Hub swift-crypto_Crypto Qwen3Speech_KokoroTTS; do
            if [ -d "$BUILT_PRODUCTS_DIR/$b.bundle" ]; then
              rm -rf "$dest/$b.bundle"
              cp -R "$BUILT_PRODUCTS_DIR/$b.bundle" "$dest/"
            fi
          done
    info:
      path: Info.plist
      properties:
        # Tie the bundle version to the build settings below, so bumping
        # MARKETING_VERSION/CURRENT_PROJECT_VERSION is the single source of truth
        # (XcodeGen otherwise rewrites these to hardcoded 1.0/1 on every generate).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        # Feedback + crash reports go to Sentry only when this is non-empty.
        SentryDSN: $(SENTRY_DSN)
        # malloc's large-allocation cache otherwise keeps ~90 MB of freed ONNX
        # Runtime init buffers resident (and ~440 MB after unloading Supertonic).
        LSEnvironment:
          MallocLargeCache: "0"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026. All rights reserved."
        CFBundleLocalizations:
          - en
          - tr
        NSServices:
          - NSMenuItem:
              default: "Narrate with Narrateify"
            NSMessage: narrateSelection
            NSPortName: Narrateify
            NSSendTypes:
              - NSStringPboardType
              - public.utf8-plain-text
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.narrateify.Narrateify
        PRODUCT_NAME: Narrateify
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "12"
        # Sentry DSN for Send Feedback + crash reports. A DSN is a public client
        # key; `xcodebuild SENTRY_DSN=` overrides it, empty turns Sentry off.
        SENTRY_DSN: ""
        INFOPLIST_FILE: Info.plist
        # Keep Hardened Runtime; App Sandbox is intentionally omitted (no
        # entitlements file -> unsandboxed, required for cross-app keystrokes
        # and launching /usr/sbin/screencapture).
        ENABLE_HARDENED_RUNTIME: true
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Narrateify-Bridging-Header.h
        # The resource-copy script writes into the bundle.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Allow ad-hoc local builds without a development team.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

  NarrateifyCLI:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tools/narrateify
      - path: Sources/API/APIEndpoint.swift
    settings:
      base:
        PRODUCT_NAME: narrateify
        # "narrateify" would clash with the app's module on a case-insensitive disk.
        PRODUCT_MODULE_NAME: NarrateifyCLI
        PRODUCT_BUNDLE_IDENTIFIER: com.narrateify.cli
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

  NarrateifyModels:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tools/narrateify-models
    dependencies:
      - package: speech-swift
        product: Qwen3TTS
      - package: speech-swift
        product: KokoroTTS
      - package: mlx-swift
        product: MLX
      - package: OnnxRuntime
        product: onnxruntime
    settings:
      base:
        PRODUCT_NAME: narrateify-models
        PRODUCT_MODULE_NAME: NarrateifyModels
        PRODUCT_BUNDLE_IDENTIFIER: com.narrateify.models
        ARCHS: arm64   # MLX is Apple silicon only
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""

  NarrateifyTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: Narrateify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.narrateify.NarrateifyTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Narrateify.app/Contents/MacOS/Narrateify"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

schemes:
  Narrateify:
    build:
      targets:
        Narrateify: all
    test:
      targets:
        - NarrateifyTests
